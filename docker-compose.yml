services:
  api:
    build:
      context: .
      dockerfile: src/FleetTracker.Api/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Server=sqlserver;Database=FleetTracker;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True
      - ConnectionStrings__Redis=redis:6379
      - Jwt__Issuer=FleetTracker
      - Jwt__Audience=FleetTracker.Client
      - Jwt__Key=FleetTracker_Super_Secret_Key_Min_32_Chars_2024!
      - UseRedis=true
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  simulator:
    build:
      context: .
      dockerfile: src/FleetTracker.Simulator/Dockerfile
    environment:
      - Simulator__VehicleIds=aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee,11111111-2222-3333-4444-555555555555,22222222-3333-4444-5555-666666666666,33333333-4444-5555-6666-777777777777,44444444-5555-6666-7777-888888888888,55555555-6666-7777-8888-999999999999,66666666-7777-8888-9999-aaaaaaaaaaaa,77777777-8888-9999-aaaa-bbbbbbbbbbbb,88888888-9999-aaaa-bbbb-cccccccccccc,99999999-aaaa-bbbb-cccc-dddddddddddd,aaaaaaaa-bbbb-cccc-dddd-111111111111,bbbbbbbb-cccc-dddd-eeee-222222222222
      - Simulator__ApiUrl=http://api:8080
      - Simulator__IntervalSeconds=3
    depends_on:
      - api
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong!Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  sqlserver_data:
  redis_data:
